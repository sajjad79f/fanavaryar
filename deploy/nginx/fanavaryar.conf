# پیکربندی Nginx برای فناوریار — Reverse Proxy + HTTPS
# مسیر نصب: /etc/nginx/sites-available/fanavaryar.conf
# فعال‌سازی: ln -s /etc/nginx/sites-available/fanavaryar.conf /etc/nginx/sites-enabled/

# ---------- ریدایرکت HTTP به HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name fanavaryar.example.ir;

    # برای صدور گواهی Let's Encrypt لازم است
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fanavaryar.example.ir;

    # مسیرهای گواهی — در محیط آزمایشی از Self-Signed استفاده کنید:
    #   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
    #     -keyout /etc/nginx/ssl/fanavaryar.key -out /etc/nginx/ssl/fanavaryar.crt \
    #     -subj "/CN=fanavaryar-test.local"
    ssl_certificate     /etc/nginx/ssl/fanavaryar.crt;
    ssl_certificate_key /etc/nginx/ssl/fanavaryar.key;

    # پیکربندی TLS مدرن
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:fanavaryar_ssl:10m;

    # هدرهای امنیتی تکمیلی
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # محدودیت حجم درخواست (آپلود فایل در فاز ۲)
    client_max_body_size 25m;

    # همه چیز به سرویس Go روی localhost:8080
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;
        proxy_read_timeout 60s;
    }
}
